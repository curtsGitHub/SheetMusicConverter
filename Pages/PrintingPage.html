<!--Printing page! Displays the sheet music, this page will be updated by the javascript file
to create the grids for notes-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Printing</title>
        <script defer src="../Script/PrintingPage.js"></script>
        <link href="../Style/PrintingPage.css" rel="stylesheet">
    </head>
    <body>
        <!--Displays title and composer-->
        <div id="Title">
            <h1 id="title"></h1>
        </div>
        <div id="Composer">
            <h2 id="composer"></h2>
        </div>
        <!--Starting table for the notes, the javascript will add to this-->
        <table class="measures" id="start1" style="border: 2px solid black;">
            
        </table>
        
        <button id="showFile">Show file</button>
        <span id="output">OUTPUT</span>
        <button id="back">Go Back</button>
        <script>
            document.getElementById("back").onclick = function () {
                window.location.href = "OpeningPage.html";
            };
        </script>
    </body>
</html>
