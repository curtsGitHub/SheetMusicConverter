<!--Load in page of my project. Upload a piece of sheet music here-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Sheet Music Converter</title>
        <script defer src="../Script/OpeningPage.js"></script>
        
        <link href="../Style/OpeningPage.css" rel="stylesheet">
    </head>
    <body>
        <div id="logo">
            <img src="../Images/Sheet Music Converter.jpg" alt="Logo" width="800" height="400" />
        </div>
        <div id="file">
            <input type="file" id="sheetMusic" name="sheetMusic" accept=".xml" />
        </div>
        <div id="fileButton">
            <button id="addFile">Choose file</button>
        </div>
        <div id="helpButton">
            <button id="help">
                <img id="helpImage" src="../Images/helpButton.png"
                      alt="Button Image">
                    </button>
        </div>
        <div id="helpBox" class="box">
            <div class="helpContent">
                <span class="close">&times;</span>
                
                <h2>Help</h2>
                <h3>How to find a musicXML file:</h3>
                <p>1. Find your desired sheet music in Musescore</p>
                <p>2. Download it as a musicXML file</p>
                <p>3. Rename it to be the title + .zip</p>
                <p>4. Unzip it</p>
                <p>5. Find the XML file</p>
                <p>6. That is the file you should put into the website</p>
                <img src="../Images/helpMenu1.png" alt="help1" width="400px" height="300px"/>
                <img src="../Images/helpMenu1.png" alt="help1" width="400px" height="300px"/>
                <img src="../Images/helpMenu1.png" alt="help1" width="400px" height="300px"/>
            </div>
        </div>
        <div id="submitButton">
            <button id="submit">Submit</button>
        </div>
        <script>
            document.getElementById("submit").onclick = function () {
                window.location.href = "PrintingPage.html";
            };
        </script>
        <!-- <form action="PrintingPage.html">
            <input type="submit" value="Click Me">
        </form> -->
    </body>
</html>
