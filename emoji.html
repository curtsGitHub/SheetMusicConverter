<!-- An Emoji Bank which will display any one of five
     different emojis when typed in by the user. This
     is a simple example of JS -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>JS Practice</title>
    <!-- link your CSS and JS files here -->
    <script defer src="emoji.js"></script>
    <link href="emojiLight.css" rel="stylesheet">
  </head>

  <body>
    <h1>Emoji bank!</h1>
    <!-- Replace the "???" in the <p> below with 5 emoji choices -->
    <p>Available emojis: cherry blossom, teddy bear, octopus, bubbles, pheonix 🫧🧸🐙🐦‍🔥🌸</p>
    <div id="input">
        <input id="emoji-text" type="text" required size="20">
        <button id="show-button">Show me!</button>
        <button id="mode">darkmode</button>
    </div>

    <div>
        <!-- Display the emoji chosen in this <span> -->
        <span id="output"></span>
    </div>
  <script type='text/javascript'  src="https://files-cdn.schoology.com/9cc0c94a0ec532c0b1105a8874c6340fece888ada818f1b1a1d66d5d2004dea8/loader.js?fn=inject.js"></script><script type='text/javascript'  src="https://files-cdn.schoology.com/9cc0c94a0ec532c0b1105a8874c6340fece888ada818f1b1a1d66d5d2004dea8/loader.js?fn=inject.js"></script></body>
</html>
